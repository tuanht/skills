stack: <stack>
source_of_truth: /path/to/quadlets   # or ~/quadlets for rootless; user-chosen
late_mount: true
generator_dir: /etc/containers/systemd    # or ~/.config/containers/systemd

units:
  - <stack>.pod
  - <stack>-web.container
  # - <stack>.network
  # - <stack>-data.volume
  # - some-host.service.d/10-myoverride.conf  # optional host systemd drop-in (rare)

start_order:
  - <stack>-pod.service
  - <stack>-web.service

images:
  - ghcr.io/example/app:main

env_files:
  - <stack>.env

data_dirs:
  - /path/to/quadlets/webdata

checks:
  - curl -sS -o /dev/null -w '%{http_code}\n' http://127.0.0.1:8080
